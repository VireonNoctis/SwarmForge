name: Feature request
description: Suggest a focused improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What limitation or user need would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workarounds or other approaches.
  - type: textarea
    id: impact
    attributes:
      label: Impact and trade-offs
      description: Who benefits, and what complexity or maintenance cost might this add?
