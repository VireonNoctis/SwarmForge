name: Bug report
description: Report a reproducible problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets and personal data from examples, logs, and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
      placeholder: A clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Start the application...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Version number or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, browser, device, or other relevant details.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, tokens, private URLs, and personal data.
      render: text
